<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My IT Journey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('tech.jpg');
            background-size: cover;
            text-align: center;
        }
        header {
            height: 80px;
            padding: 20px;
        }
        h2{
            margin-top: -50px;
            color: antiquewhite;
            font-size: 100px;
        }
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            background: rgba(29, 29, 34, 0.808);
            padding: 10px;
            border: 1px solid rgba(225, 226, 228, 0.3);
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
            padding: 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }
        section {
            margin-top: -10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        section h2{
            margin-top: -10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            height: 100px;
            font-weight: lighter;
            text-shadow: 2px 2px 4px #e2d9d9;
        }
        section p{
            color: #e2d9d9;
            font-size: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: -10px;
        }
        .BUTTON{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 120px;
        }
        .button {
            height: 255px;
            width: 230px;
            background: rgba(29, 29, 34, 0.808);
            background-size: 225px 225px;
            background-position: bottom;    
            background-repeat: no-repeat;
            border-color: rgb(175, 175, 179);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            h2 {
                font-size: 30px;
            }
            section p {
                font-size: 20px;
            }
            nav ul {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            nav ul li {
                display: block;
                padding: 10px 0;
            }
            .BUTTON {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .button {
                width: 90%;
                height: auto;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>

                <li><a href="worshipper.html">SPIRIT</a></li>
            </ul>
        </nav>
    </header>
    
    <section>
        <h2>WELCOME
            <p>Computer Engineer</p>
        </h2>
    </section>
    <div class="BUTTON">
        <button class="button" style="background-image: url('Hardware.jpg');">HARDWARE</button>
        <button class="button" style="background-image: url('Software.jpg');">SOFTWARE</button>
        <button class="button" style="background-image: url('Network.jpg');">NETWORK</button>
    </div>
</body>
</html>
